- check: slop
  rule: echo-triad
  location: "paper/sections/01_introduction.tex (paragraph heading '\\paragraph{What we do not claim.}' followed by a sentence starting the same way)"
  reason: "LaTeX \\paragraph{} heading convention, not repeated prose. Rewriting either breaks the heading style or forces an awkward first sentence."
  approved_by: Alex

- check: slop
  rule: echo-triad
  location: "paper/sections/03_model.tex, Algorithm environment (pseudocode lines matching 'generate ... execute ... break')"
  reason: "Algorithmic pseudocode, not prose. The pattern match fires on repeated command-verb structure that is required by the algorithmic environment."
  approved_by: Alex

- check: slop
  rule: load-bearing-vocabulary
  location: "whole document (259 distinct words from the load-bearing list across 10.5k words, doc-level statistic)"
  reason: "A 25-page technical paper with statistics, formal model and results necessarily uses a wide vocabulary; the finding is a document-level rate, not a specific sentence to edit. Needs an editorial pass, not a mechanical fix, without risking precision loss."
  approved_by: PENDING_HUMAN_REVIEW

- check: slop
  rule: pr-vocabulary
  location: "whole document (84 distinct words, doc-level statistic)"
  reason: "Same class as load-bearing-vocabulary above: a whole-document rate on a long technical paper, not a locatable sentence-level defect."
  approved_by: PENDING_HUMAN_REVIEW

- check: slop
  rule: colon-appositive
  location: "whole document (69 occurrences, 6.58 per 1000 words, doc-level statistic)"
  reason: "Colon-led explanatory clauses are standard scientific-writing structure for stating a result then unpacking it (see the reference papers this manuscript models its form on). Converting all 69 to periods/commas would flatten the paper's register rather than fix a real defect."
  approved_by: PENDING_HUMAN_REVIEW

- check: slop-ru
  rule: em-dash-overuse-ru
  location: "paper-ru/sections/03_model.tex (notation-definition sentence: 'P -- spec, o_t -- observation, a_t -- action, R_t -- reasoning') and paper-ru/sections/03b_study_design.tex (verifier-selection list: 'test A -- for X, test B -- for Y, test C -- for Z')"
  reason: "Each dash marks a separate subject-predicate-omission clause defining one symbol or one test in a list, not a chain of rhetorical dashes in narrative prose. Standard Russian mathematical-notation convention ('P -- eto X, Q -- eto Y'); rewriting to avoid dashes would require awkward repeated 'eto' or splitting one definitional sentence into four, degrading the notation block's readability for no accuracy gain."
  approved_by: PENDING_HUMAN_REVIEW
