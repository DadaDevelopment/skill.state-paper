- id: "arxiv:2609.20804"
  title: "An Empirical Study of Harness Design for Coding Agents"
  decision: cite
  reason: >
    Direct overlap: 176 matched settings ablating context-management
    strategies, context-window budgets, planning and action space across
    SWE-Bench Verified and Terminal-Bench 2.1. Read in full (not abstract
    only): their headline finding "context management extends execution
    trajectories without substantially altering agent behavior" and their
    finding that reversible recall (their M2) is rarely invoked and adds
    no accuracy gain both parallel our own results (tail6 restores
    capability mainly through more turns/tokens, and our composition
    ladder's own instrumentation counters are dead/underused). Their axis
    (how much transcript-management machinery) is orthogonal to ours
    (state vs transcript), which makes it a genuine related-work citation,
    not a competing claim.
    STATUS: APPLIED - cited as harnessdesign2026 with a dedicated
    related-work paragraph in paper/sections/13_related.tex.

- id: "arxiv:2606.30005"
  title: "LLM Agents Are Latent Context Managers: Eliciting Self-Managed Context via State Proprioception (VISTA)"
  decision: cite
  reason: >
    Found by following this paper's own citation graph (cited inside
    arxiv:2609.20804's context-management related work), not by the
    literature-watch keyword search. Argues models are "proprioceptively
    blind" to their own context (cannot infer block size/recency/budget
    from the prompt alone) and fixes this with a runtime dashboard plus
    typed addressable memory blocks with full-fidelity archival/recovery.
    This is close kin to our mechanism finding: our state-only arm
    re-derives information it already observed (58% repeated inspect vs
    20% control) because the state block bounds what is TOLD without
    bounding what is NEEDED - VISTA's proprioception framing is a plausible
    alternative or complementary explanation for part of that gap, and its
    training-free/model-agnostic design is directly comparable to our
    runtime-written composition axis (v1-v7). Worth a related-work
    paragraph and possibly a discussion-section mention as a candidate
    mechanism we did not isolate.
    STATUS: APPLIED - cited as vista2026 with a dedicated related-work
    paragraph in paper/sections/13_related.tex; full paper read.

- id: "arxiv:2605.04050"
  title: "LCM: Lossless Context Management"
  decision: cite
  reason: >
    Also found via arxiv:2609.20804's citation graph. Claims a deterministic
    hierarchical-summary-DAG architecture that outperforms Claude Code on
    long-context tasks by keeping lossless pointers to every original
    message rather than discarding on compaction. Directly relevant to our
    Ledger comparison (Section 13): both LCM and Ledger keep objective,
    runtime-managed state rather than model-authored summaries, but LCM's
    specific claim (recursive compression beats flat summarization) is a
    design point our composition ladder (v1-v7) does not test and should
    at minimum be named as a design this study did not include.
    STATUS: APPLIED - cited as lcm2026 with a dedicated related-work
    paragraph in paper/sections/13_related.tex; full paper read.

- id: "arxiv:2609.20754"
  title: "RAFT: A Stateful Retrieval-Augmented Framework for Troubleshooting Agents"
  decision: exclude
  reason: >
    Retrieval-augmented case lookup for enterprise support, not agent context
    engineering or coding-agent state representation. Different problem
    despite the word "stateful" in the title.

- id: "arxiv:2609.20625"
  title: "Chronicle: Cut-Point Replay for Regression Testing of LLM Agents"
  decision: exclude
  reason: >
    Record-and-replay for regression testing, not memory/context
    representation. Orthogonal contribution.

- id: "arxiv:2609.20812"
  title: "Quantifying Overclaiming Propensity in Frontier LLM Agents"
  decision: exclude
  reason: >
    Measures whether an agent's final response contradicts its own context
    (an honesty/reporting metric), not context or state representation
    design. Not a related-work candidate for this paper's mechanism.

- id: "arxiv:2609.20822"
  title: "Coding Agents with an Obstacle-Aware Harness for Safe Robot Manipulation"
  decision: exclude
  reason: >
    Safety-constraint compliance in robot manipulation via coding agents;
    no relation to context/state representation or token economics.
